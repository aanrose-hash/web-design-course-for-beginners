<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>
    <form action="">
        <label for="name">NAME</label>
        <input id="name" type="text" name="name" >
       <br>
        <label for="phone-no">PHONE NO</label>
        <input id="phone-no" type="tel" name="phone-no">
        <br>
        <label for="email-id">EMAILID</label>
        <input id="email-id" type="email" name="email-id">
        <br>
        <label for="remarks">REMARKS</label>
        <textarea name="entry" id="remarks" cols="30" rows="8"></textarea>
       <br>
        <button type="submit">SUBMIT</button>

        <h1>Checkboxes</h1>
        <fieldset>
            <legend>Which pizza toppings do you prefer?</legend>
             <label for="topping-1">pepperoni</label>
        <input id="topping-1" type="checkbox" name="pepperoni">
          <label for="topping-2">pineapple</label>
        <input id="topping-2" type="checkbox" name="pineapple">  
        <label for="topping-3">meatballs</label>
        <input id="topping-3" type="checkbox" name="meatballs">
        </fieldset>
        <h1>Radiobuttons</h1>
        <fieldset>
            <legend>Which shirt size  you prefer?</legend>
             <label for="small">small</label>
        <input id="small" type="radio" name="size" value="s">
          <label for="large">large</label>
        <input id="large" type="radio" name="size"value="l">  
        <label for="medium">medium</label>
        <input id="medium" type="radio" name="size"value="m">
        </fieldset>
       
    </form>
</body>
</html3
